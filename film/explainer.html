  moves(c, lt, t, d) {

    fade(c, clamp((lt - w0) / 0.08), () => kword(c, s, CX, iy, wT, { col: KC, s: lerp(0.6, 1, k) }));

    fade(c, smooth(clamp((fly - 0.75) / 0.25)), () => { c.fillStyle = KC; c.fillRect(0, 0, W, H); });

  text(c, lt) {
    c.fillStyle = KC; c.fillRect(0, 0, W, H);
    const D = KIT.lang[LANG].page;
    kdrop(c, KW.text[0], CX, by(0.33), bw(0.8), lt, { col: KI, step: 0.04 });
    const k = outExpo(clamp((lt - 0.18) / 0.3));
    kword(c, KW.text[1], CX + (1 - k) * W, by(0.58), bw(0.8), { col: KHD, smear: (1 - k) * 300 });
    // the headline is plain HTML, there before anything moves

    setFont(c, 600, 44, true); const tw = c.measureText(tag).width, sz = Math.min(44, (44 * bw(0.9)) / tw);

  },
  zero(c, lt, t) {
    kback(c, t - KLIVE, 1.12);
    ksmall(c, 'preload="none"', CX, by(0.18), 52, KH, { mono: true, weight: 600 });
    const k = outExpo(clamp(lt / 0.2));
    kword(c, '0 B', CX, by(0.47), bw(0.56), { col: KC, s: lerp(1.2, 1, k), colLast: KH });
    KW.zero.forEach((l, i) => ksmall(c, l, CX, by(0.76) + i * 64, 54, KC, { weight: 700 }));
  },
  paused(c, lt, t) {
    kaurora(c);
    const U = KIT.lang[LANG].ui, up = inExpo(clamp(lt / 0.32)), w = bw(0.5);

      c.save(); c.translate(0, -up * H);

    const k = outExpo(clamp((lt - 0.3) / 0.2));
    if (lt > 0.3) {
      kword(c, KW.paused, CX, by(0.52), bw(0.84), { col: KI, s: lerp(1.6, 1, k), rot: lerp(-0.2, -0.05, k) });
      fade(c, clamp((lt - 0.45) / 0.15), () => para(c, U.paused, CX, by(0.74), { size: 38, weight: 600, col: KI, maxW: bw(0.8), lh: 50, align: 'center', balance: true }));

  },
  still(c, lt) {
    // no motion at all, the sky included: it simply is there, which is the point
    kback(c, 0, 1.06, { still: true });
    ksmall(c, KW.reducedQ, CX, by(0.2), 50, KH, { weight: 700 });
    kword(c, KW.still[0], CX, by(0.45), bw(0.8), { col: KC });

  },

    kword(c, KW.breaks[0], CX, by(0.27), bw(0.74), { col: KI, s: lerp(1.3, 1, outExpo(clamp(lt / 0.2))) });
    kword(c, KW.breaks[1], CX, by(0.43), bw(0.74), { col: KI, s: lerp(1.3, 1, outExpo(clamp((lt - 0.06) / 0.2))) });

  json(c, lt) {

function kinetic(c, t) {
  let i = 0; while (i + 1 < KSHOTS.length && t >= KSHOTS[i + 1][0]) i++;
  const [t0, name] = KSHOTS[i], d = (KSHOTS[i + 1] ? KSHOTS[i + 1][0] : DUR) - t0, lt = t - t0;
  // every cut lands with a small punch and a slow drift, so no frame is ever quite still (but "starts still" is)
  const calm = name === 'still' || name === 'end' || name === 'moves' || name === 'page';
  const punch = name === 'still' ? 1 : 1 + (name === 'page' ? 0 : 0.05 * (1 - outExpo(clamp(lt / 0.25)))) + 0.02 * (lt / d) * (name === 'page' ? 0 : 1);
  const roll = calm ? 0 : (i % 2 ? 1 : -1) * 0.006 * (lt / d);
  // the two hardest hits shake the frame once, for four frames (smaller than the punch's margin, so no edge shows)
  const sh = name === 'rude' || name === 'zero' ? 8 * Math.pow(1 - clamp(lt / 0.12), 2) : 0;
  c.save(); c.translate(W / 2 + sh * Math.sin(lt * 95), H / 2 + sh * Math.cos(lt * 80)); c.scale(punch, punch); c.rotate(roll); c.translate(-W / 2, -H / 2);
  KSHOT[name](c, lt, t, d);

}
// the soundtrack's cues (scripts/score_film.py turns them into sound): a hit on every cut, ticks while the counter
// runs and the terminal types, a click and a drop on the press, whooshes into the big moves, silence for "starts still"
const KCUES = (() => {
  const at = (n) => KSHOTS.find(([, s]) => s === n)[0], out = [];
  for (const [t0, n] of KSHOTS) if (!['problem', 'page', 'moves', 'still', 'end', 'paused'].includes(n)) out.push({ t: t0, k: 'hit' });
  for (let i = 0; i < 8; i++) out.push({ t: 0.2 + i * 0.065, k: 'tick', freq: 700 + i * 90, gain: 0.16 });
  out.push({ t: 0.72, k: 'hit' });
  out.push({ t: at('page'), k: 'whoosh', until: at('page') + 0.3, gain: 0.3 }, { t: KPRESS, k: 'press' });
  out.push({ t: at('page') + 1.45, k: 'whoosh', until: at('page') + 2.15, gain: 0.45 });
  out.push({ t: at('moves') + 0.55, k: 'hit' });
  out.push({ t: at('text') - 0.5, k: 'whoosh', until: at('text'), gain: 0.7 });
  out.push({ t: at('paused'), k: 'whoosh', until: at('paused') + 0.3, gain: 0.5 }, { t: at('paused') + 0.3, k: 'hit' });
  out.push({ t: at('still'), k: 'mute', until: at('missing') });
  out.push({ t: at('missing') + 0.28, k: 'hit' });
  KTERM.forEach(([p], i) => out.push({ t: at('json') + 0.15 + i * 0.1, k: 'tick', freq: p ? 1500 : 1100, gain: 0.14 }));
  out.push({ t: at('end') - 0.45, k: 'whoosh', until: at('end'), gain: 0.8 }, { t: at('end'), k: 'end' });
  return out.sort((a, b) => a.t - b.t);
})();
// the same words as a list, for the text version under the player
const KTEXT = [
  `${KW.usual} <video autoplay muted loop>. ${KB} kB ${KW.fetched} (${KW.demo}).`,
  `${KW.is} ${KW.rude.toLowerCase()} ${KW.make} ${KW.wait.toLowerCase()}`,
  `${KW.press.join(' ')} ${OPENING} (${ILLU})`,
  `${KW.then} ${KW.moves.toLowerCase()}`,
  `${KW.text.join(' ').toLowerCase()} <h1>${KIT.lang[LANG].page.headline}</h1>`,
  `0 B: ${KW.zero.join(' ')}. (preload="none")`,
  `${KW.away.replace(' ↑', '')}: ${KIT.lang[LANG].ui.paused}`,
  `${KW.reducedQ} ${KW.still.join(' ').toLowerCase()}`,
  `${KW.missingQ} ${KW.breaks.join(' ').toLowerCase()}`,
  `${KW.json} ` + KTERM.filter(([p]) => p).map(([p, s]) => s.replace(/ \\$/, '')).join(' ') + `: ${KTERM[KTERM.length - 1][1]}. ${KW.deps}.`,
];

// ---- one frame ---------------------------------------------------------------------------------
function draw(c, t) {
  c.setTransform(1, 0, 0, 1, 0, 0);
  if (CLIP) { scene(c, 0, 0, W, t, { len: DUR, noLabel: true }); return; }
  kinetic(c, t);
}


// ---- player and render hooks -------------------------------------------------------------------
const canvas = document.getElementById('film'), ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;
if (Q.get('render')) document.body.classList.add('render');
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
scrub.max = DUR;
let now = Math.min(+Q.get('t') || 0, DUR), playing = false, last = 0;
function show(t) { now = clamp(Number.isFinite(t) ? t : 0, 0, DUR); draw(ctx, now); scrub.value = now; clock.textContent = now.toFixed(1) + ' s'; }
function tick(ms) {
  if (!playing) return;
  now += (ms - last) / 1000; last = ms;
  if (now >= DUR) { show(DUR); setPlaying(false); return; }
  show(now); requestAnimationFrame(tick);
}
function setPlaying(on) {
  playing = on; playBtn.setAttribute('aria-pressed', String(on)); playBtn.textContent = on ? 'Pause film' : 'Play film';
  if (on) { if (now >= DUR) now = 0; last = performance.now(); requestAnimationFrame(tick); }
}
playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { setPlaying(false); show(+scrub.value); });
document.addEventListener('visibilitychange', () => { if (document.hidden) setPlaying(false); });
// the format and language links keep the other choice (and the Spanish view links back to English)
for (const a of document.querySelectorAll('a[data-k]')) {
  if (a.dataset.k === 'lang' && ES) { a.dataset.v = 'en'; a.textContent = 'English'; a.hreflang = a.lang = 'en'; }
  const p = new URLSearchParams(location.search); p.delete('t'); p.delete('render'); p.set(a.dataset.k, a.dataset.v); a.search = '?' + p;
}
// the text version: the same words the film shows, in the cut's language, for anyone who would rather read
{
  const box = document.getElementById('text-version'), list = document.getElementById('text-beats');
  box.lang = LANG; box.querySelector('summary').textContent = ES ? 'Versión en texto' : 'Text version';
  const D = KIT.lang[LANG].page, out = [];
  if (CLIP) out.push((ES ? 'El video del ejemplo: ' : "The example's video: ") + OPENING);
  else {
    for (const line of KTEXT) out.push(line);
    out.push((ES ? 'Cierre: ' : 'End card: ') + 'Hero in Motion. ' + END.tag + ' ' + END.cta + ': ' + OWNER + NAME + '.');
  }
  for (const line of out) { const li = document.createElement('li'); li.textContent = line; list.append(li); }
}
// scripts/render_film.py waits for film.ready, then calls film.frame(i) for each frame
// (layered says whether the poster has the layers the motion needs: render_film.py warns when it does not)
window.film = { width: W, height: H, fps: FPS, duration: DUR, frames: Math.round(DUR * FPS), layered: LAYERED, cues: CLIP ? null : KCUES,
  ready: Promise.all([posterReady, document.fonts.ready]).then(() => show(now)),
  frame: (i) => show(i / FPS) };
