<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">The hero, part by part</title>
<desc id="d">A drawing of the built page: words on the left, a still picture with a Play button on the right, and six numbered notes. Below, three steps: on load the page fetches its HTML and the poster; on Play it fetches the video; when hidden or scrolled away it pauses.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050b1f"/><stop offset="1" stop-color="#0c2a3a"/></linearGradient>
<linearGradient id="band" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5dffae" stop-opacity=".85"/><stop offset=".6" stop-color="#19d394" stop-opacity=".3"/><stop offset="1" stop-color="#7a6cff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<clipPath id="pic"><rect x="456" y="150" width="330" height="330" rx="22"/></clipPath>
</defs>
<rect width="1200" height="760" fill="#06142a"/>
<text x="60" y="62" fill="#f4f1e8" font-size="30" font-weight="750" letter-spacing="-.5">The hero, part by part</text>
<text x="1140" y="62" fill="#9fb3c8" font-size="16" text-anchor="end">a drawing, not a screenshot</text>

<!-- the page -->
<rect x="60" y="92" width="770" height="440" rx="16" fill="#f1f4f1"/>
<path d="M60 108 a16 16 0 0 1 16 -16 h738 a16 16 0 0 1 16 16 v20 h-770z" fill="#dfe6e1"/>
<circle cx="84" cy="110" r="5" fill="#b9c4bd"/><circle cx="102" cy="110" r="5" fill="#b9c4bd"/><circle cx="120" cy="110" r="5" fill="#b9c4bd"/>
<!-- words -->
<text x="100" y="226" fill="#10202d" font-size="13" font-weight="750">Fictional example</text>
<text x="100" y="272" fill="#10202d" font-size="40" font-weight="800" letter-spacing="-1.2">Nights worth</text>
<text x="100" y="314" fill="#10202d" font-size="40" font-weight="800" letter-spacing="-1.2">staying up for.</text>
<rect x="100" y="338" width="300" height="9" rx="4.5" fill="#10202d" fill-opacity=".45"/>
<rect x="100" y="356" width="250" height="9" rx="4.5" fill="#10202d" fill-opacity=".45"/>
<rect x="100" y="388" width="150" height="42" rx="9" fill="#0b6a52"/>
<text x="175" y="415" fill="#ffffff" font-size="15" font-weight="650" text-anchor="middle">See the cabins</text>
<!-- picture -->
<g clip-path="url(#pic)">
<rect x="456" y="150" width="330" height="330" fill="url(#sky)"/>
<g filter="url(#glow)"><path d="M470 330 C500 200 540 190 560 330Z M545 330 C590 170 640 180 660 330Z M650 330 C690 215 740 200 775 330Z" fill="url(#band)"/></g>
<g fill="#f4f1e8"><circle cx="492" cy="182" r="1.6"/><circle cx="540" cy="170" r="1.2"/><circle cx="604" cy="186" r="1.5"/><circle cx="668" cy="168" r="1.2"/><circle cx="730" cy="190" r="1.6"/><circle cx="762" cy="172" r="1.1"/></g>
<path d="M456 352 C520 322 580 344 640 330 C700 316 750 338 786 328 V366 H456Z" fill="#081a2b"/>
<rect x="456" y="362" width="330" height="118" fill="#0a2233"/>
<path d="M480 372 C560 420 700 420 770 372" fill="none" stroke="#5dffae" stroke-opacity=".28" stroke-width="26" filter="url(#glow)"/>
<path d="M596 362 v-20 l18 -14 l18 14 v20z" fill="#040c18"/><rect x="608" y="346" width="12" height="12" fill="#ffc46b"/>
<rect x="608" y="368" width="12" height="20" fill="#ffc46b" fill-opacity=".35"/>
</g>
<rect x="456" y="150" width="330" height="330" rx="22" fill="none" stroke="#808c96" stroke-opacity=".5"/>
<!-- play button and status line, on the picture -->
<rect x="652" y="426" width="118" height="38" rx="19" fill="#060e18" fill-opacity=".9" stroke="#ffffff" stroke-width="2"/>
<path d="M670 437 l12 8 l-12 8z" fill="#ffffff"/><text x="690" y="450" fill="#ffffff" font-size="14" font-weight="650">Play video</text>
<rect x="472" y="430" width="164" height="30" rx="12" fill="#060e18" fill-opacity=".9" stroke="#5dffae" stroke-opacity=".7" stroke-dasharray="4 4"/>
<text x="554" y="450" fill="#ffffff" font-size="12.5" text-anchor="middle">Paused. Press Play…</text>

<!-- numbered marks on the page -->
<g font-size="15" font-weight="800" text-anchor="middle" fill="#06142a">
<circle cx="82" cy="262" r="14" fill="#5dffae"/><text x="82" y="267">1</text>
<circle cx="472" cy="166" r="14" fill="#5dffae"/><text x="472" y="171">2</text>
<circle cx="770" cy="420" r="14" fill="#5dffae"/><text x="770" y="425">3</text>
<circle cx="476" cy="424" r="14" fill="#5dffae"/><text x="476" y="429">4</text>
<circle cx="806" cy="150" r="14" fill="#5dffae"/><text x="806" y="155">5</text>
<circle cx="621" cy="300" r="14" fill="#5dffae"/><text x="621" y="305">6</text>
</g>

<!-- the notes -->
<g fill="#f4f1e8" font-size="16">
<g transform="translate(872 104)"><circle cx="14" cy="14" r="14" fill="#5dffae"/><text x="14" y="19" font-size="15" font-weight="800" text-anchor="middle" fill="#06142a">1</text><text x="40" y="13" font-weight="700">Words first</text><text x="40" y="34" fill="#b8c7d6" font-size="14.5">Plain HTML. It works with no video.</text></g>
<g transform="translate(872 176)"><circle cx="14" cy="14" r="14" fill="#5dffae"/><text x="14" y="19" font-size="15" font-weight="800" text-anchor="middle" fill="#06142a">2</text><text x="40" y="13" font-weight="700">A still poster</text><text x="40" y="34" fill="#b8c7d6" font-size="14.5">The only picture fetched on load.</text></g>
<g transform="translate(872 248)"><circle cx="14" cy="14" r="14" fill="#5dffae"/><text x="14" y="19" font-size="15" font-weight="800" text-anchor="middle" fill="#06142a">3</text><text x="40" y="13" font-weight="700">Play, on the picture</text><text x="40" y="34" fill="#b8c7d6" font-size="14.5">The video is fetched on this press,</text><text x="40" y="53" fill="#b8c7d6" font-size="14.5">never before. No autoplay.</text></g>
<g transform="translate(872 339)"><circle cx="14" cy="14" r="14" fill="#5dffae"/><text x="14" y="19" font-size="15" font-weight="800" text-anchor="middle" fill="#06142a">4</text><text x="40" y="13" font-weight="700">A status line</text><text x="40" y="34" fill="#b8c7d6" font-size="14.5">Shown only when it has news.</text><text x="40" y="53" fill="#b8c7d6" font-size="14.5">Screen readers always hear it.</text></g>
<g transform="translate(872 430)"><circle cx="14" cy="14" r="14" fill="#5dffae"/><text x="14" y="19" font-size="15" font-weight="800" text-anchor="middle" fill="#06142a">5</text><text x="40" y="13" font-weight="700">It pauses by itself</text><text x="40" y="34" fill="#b8c7d6" font-size="14.5">Hidden tab or scrolled away: paused.</text><text x="40" y="53" fill="#b8c7d6" font-size="14.5">It never starts again by itself.</text></g>
<g transform="translate(872 521)"><circle cx="14" cy="14" r="14" fill="#5dffae"/><text x="14" y="19" font-size="15" font-weight="800" text-anchor="middle" fill="#06142a">6</text><text x="40" y="13" font-weight="700">It fails softly</text><text x="40" y="34" fill="#b8c7d6" font-size="14.5">No poster: its description shows.</text><text x="40" y="53" fill="#b8c7d6" font-size="14.5">No video: a short message.</text></g>
</g>

<!-- what is fetched, and when -->
<g font-size="15">
<rect x="60" y="604" width="330" height="104" rx="14" fill="#0d2038" stroke="#2a4466"/>
<text x="82" y="636" fill="#5dffae" font-weight="800" font-size="13" letter-spacing="1.5">ON LOAD</text>
<text x="82" y="664" fill="#f4f1e8" font-weight="700" font-size="18">The page and the poster</text>
<text x="82" y="688" fill="#b8c7d6">0 B of video. Nothing moves.</text>
<path d="M398 656 h34 m-10 -8 l10 8 l-10 8" stroke="#5dffae" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="440" y="604" width="330" height="104" rx="14" fill="#0d2038" stroke="#2a4466"/>
<text x="462" y="636" fill="#5dffae" font-weight="800" font-size="13" letter-spacing="1.5">ON PLAY</text>
<text x="462" y="664" fill="#f4f1e8" font-weight="700" font-size="18">The video, and its captions</text>
<text x="462" y="688" fill="#b8c7d6">Asked for by the visitor's own press.</text>
<path d="M778 656 h34 m-10 -8 l10 8 l-10 8" stroke="#5dffae" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="604" width="320" height="104" rx="14" fill="#0d2038" stroke="#2a4466"/>
<text x="842" y="636" fill="#5dffae" font-weight="800" font-size="13" letter-spacing="1.5">OUT OF VIEW</text>
<text x="842" y="664" fill="#f4f1e8" font-weight="700" font-size="18">Paused, and it stays paused</text>
<text x="842" y="688" fill="#b8c7d6">Until the visitor presses Play again.</text>
</g>
</svg>
